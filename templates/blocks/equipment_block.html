{% load wagtailcore_tags wagtailimages_tags %}
<article class="equipment-item">
    <div class="equipment-item__image">
        {% image value.image fill-720x520-c100 as theimage %}
        <img src="{{ theimage.url }}" width="{{ theimage.width }}" height="{{ theimage.height }}" alt="{{ theimage.alt }}" loading="lazy" />
        <span class="equipment-item__stamp">FHP / KIT</span>
        <span class="equipment-item__arrow" aria-hidden="true">↗</span>
    </div>
    <div class="equipment-item__body">
        <p class="equipment-item__index">Item / <span aria-hidden="true"></span></p>
        <h2>{% include_block value.title %}</h2>
        <div class="equipment-item__description">{% include_block value.description %}</div>
    </div>
</article>
